name: Pol Agent Trigger

on:
  issues:
    types: [labeled]

jobs:
  start-pol:
    if: github.event.label.name == 'pol'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Pol work branch
        id: prepare-branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          short_title=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          branch="pol/${ISSUE_NUMBER}-${short_title}"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$branch" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch" origin/main
          fi

          ahead_count=$(git rev-list --count origin/main..HEAD)

          if [ "$ahead_count" -eq 0 ]; then
            git commit --allow-empty -m "chore: initialize Pol work branch for #$ISSUE_NUMBER"
            git push origin "$branch"
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            git push origin "$branch"
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: React with 👀 on the issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              content: 'eyes'
            });

      - name: Create branch and draft WIP Pull Request
        uses: actions/github-script@v7
        env:
          POL_BRANCH: ${{ steps.prepare-branch.outputs.branch }}
          POL_BRANCH_INITIALIZED: ${{ steps.prepare-branch.outputs.initialized }}
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const branch = process.env.POL_BRANCH;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pr;

            // Build PR body
            const labels = issue.labels.map(l => `\`${l.name}\``).join(', ') || '_none_';
            const milestone = issue.milestone ? issue.milestone.title : '_none_';
            const prBody = [
              `## 🤖 Pol is working on this`,
              ``,
              `Copilot agent **Pol** has been assigned to this issue and is actively working on the implementation.`,
              ``,
              `> Fixes #${issueNumber}`,
              ``,
              `---`,
              ``,
              `### 📋 Issue details`,
              `| Field | Value |`,
              `|-------|-------|`,
              `| Issue | [#${issueNumber} — ${issue.title}](${issue.html_url}) |`,
              `| Labels | ${labels} |`,
              `| Milestone | ${milestone} |`,
              `| Branch | \`${branch}\` |`,
              ``,
              `### 📝 Issue description`,
              ``,
              issue.body || '_No description provided._',
              ``,
              `---`,
              ``,
              `### 🔄 Pol workflow status`,
              ``,
              `- [x] 👀 Issue received and acknowledged`,
              `- [x] 🌿 Branch \`${branch}\` ready`,
              `- [x] 📬 Draft PR opened`,
              `- [ ] 🔍 Codebase inspection`,
              `- [ ] ⚙️ Implementation`,
              `- [ ] ✅ Validation / tests`,
              `- [ ] 📦 Final commit pushed`,
              `- [ ] 🚀 PR ready for review`,
              ``,
              `---`,
              `*This PR was created automatically when label \`pol\` was added to issue #${issueNumber}.*`,
              `*Pol will push implementation commits to this branch via VS Code Copilot Agent.*`
            ].join('\n');

            const issueCommentPrefix = `## 🤖 Pol is on it!`;

            try {
              // Reuse an existing PR if present, otherwise create the draft PR.
              const { data: existingPulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`,
                base: 'main'
              });

              if (existingPulls.length > 0) {
                pr = existingPulls[0];
              } else {
                const { data: createdPr } = await github.rest.pulls.create({
                  owner, repo,
                  title: `WIP: ${issue.title} (fixes #${issueNumber})`,
                  head: branch,
                  base: 'main',
                  body: prBody,
                  draft: true
                });
                pr = createdPr;
              }

              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issueNumber,
                body: [
                  issueCommentPrefix,
                  ``,
                  `👀 I'm reviewing this issue and starting implementation.`,
                  ``,
                  `A **draft WIP Pull Request** is ready: **[${pr.title}](${pr.html_url})**`,
                  ``,
                  `You can track all progress and activity inside that PR.`,
                  `Once implementation is complete, the PR will be marked ready for review and this issue will be closed automatically on merge.`,
                  ``,
                  `---`,
                  `*Branch: \`${branch}\`*`
                ].join('\n')
              });

              core.notice(`Draft PR ready: ${pr.html_url}`);
            } catch (error) {
              const permissionBlocked = error.status === 403 && String(error.message || '').includes('not permitted to create or approve pull requests');

              if (!permissionBlocked) {
                throw error;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  issueCommentPrefix,
                  ``,
                  `👀 I'm reviewing this issue and the working branch is ready: \`${branch}\`.`,
                  ``,
                  `The draft WIP Pull Request could not be created automatically because this repository has **GitHub Actions PR creation disabled**.`,
                  ``,
                  `To enable the full Pol flow, turn on this repository setting:`,
                  `**Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**`,
                  ``,
                  `After enabling it, remove and re-add the \`pol\` label, or manually open the PR from branch \`${branch}\`.`,
                  ``,
                  `---`,
                  `*Empty initialization commit created in this run: ${process.env.POL_BRANCH_INITIALIZED === 'true' ? 'yes' : 'no'}*`
                ].join('\n')
              });

              core.setFailed('GitHub Actions is not permitted to create pull requests in this repository. Enable Actions PR creation in repository settings.');
            }
